<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00513f" />
      <stop offset="100%" stop-color="#0a0e12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#46f1c5" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#46f1c5" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Electric Rickshaw Body -->
  <g transform="translate(64, 70) scale(6)" filter="url(#glow)">
    <!-- Cabin Roof & Hood -->
    <path d="M14 26 C14 15, 26 12, 38 12 C44 12, 48 15, 50 20 L50 34 L14 34 Z" fill="#46f1c5" fill-opacity="0.35" stroke="#46f1c5" stroke-width="2.5" />
    <!-- Pillars -->
    <path d="M22 16 C23 22, 23 28, 23 34" stroke="#46f1c5" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M50 22 L58 30 L58 40 L50 40" stroke="#46f1c5" stroke-width="2.5" stroke-linecap="round" />
    <!-- Chassis Floor -->
    <path d="M10 40 L58 40" stroke="#46f1c5" stroke-width="3" stroke-linecap="round" />
    <!-- Wheels -->
    <circle cx="18" cy="48" r="7" stroke="#46f1c5" stroke-width="2.5" fill="#12171c" />
    <circle cx="54" cy="48" r="7" stroke="#46f1c5" stroke-width="2.5" fill="#12171c" />
    <circle cx="18" cy="48" r="2.5" fill="#46f1c5" />
    <circle cx="54" cy="48" r="2.5" fill="#46f1c5" />
    <!-- Stylized Tesla T Emblem in Gold -->
    <path d="M28 20 H34 M31 20 V25" stroke="#feb700" stroke-width="2.2" stroke-linecap="round" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" text-anchor="middle" fill="#46f1c5" font-family="system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    OI TESLA
  </text>
</svg>
