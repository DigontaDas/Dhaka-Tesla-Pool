services:
  postgres:
    image: postgres:16-alpine
    container_name: oi-tesla-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oitesla_secure_password_2026
      POSTGRES_DB: oi_tesla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./oi-tesla/supabase/combined_migration.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oi_tesla"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./oi-tesla/backend
      dockerfile: Dockerfile
    container_name: oi-tesla-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:oitesla_secure_password_2026@postgres:5432/oi_tesla
      JWT_SECRET: oi-tesla-production-secret-key-dhaka
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./oi-tesla/frontend
      dockerfile: Dockerfile
    container_name: oi-tesla-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
